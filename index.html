<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lang-title">☕ Scheduly – Jadwal & Catatan Tim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Plus Jakarta Sans & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Web Manifest -->
    <link rel="manifest" id="my-manifest">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-playful { font-family: 'Quicksand', sans-serif; }
        
        .badge-FULL { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 2px 5px rgba(16, 185, 129, 0.3); }
        .badge-Ps { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 2px 5px rgba(245, 158, 11, 0.3); }
        .badge-Pc { background: linear-gradient(135deg, #d946ef, #c026d3); color: white; box-shadow: 0 2px 5px rgba(217, 70, 239, 0.3); }
        .badge-PS { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; box-shadow: 0 2px 5px rgba(99, 102, 241, 0.3); }
        .badge-OFF { background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; box-shadow: 0 2px 5px rgba(244, 63, 94, 0.3); }
        .badge-C { background: linear-gradient(135deg, #64748b, #475569); color: white; box-shadow: 0 2px 5px rgba(100, 116, 139, 0.3); }
        .badge-P, .badge-So { background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; font-weight: bold; }

        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.2); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-amber-50/30 to-emerald-50/30 text-slate-700 min-h-screen flex flex-col selection:bg-amber-200">

    <!-- Header -->
    <header class="glass-card shadow-sm px-4 md:px-6 py-4 sticky top-0 z-30 flex justify-between items-center border-b border-amber-100/60">
        <div class="flex items-center gap-3">
            <div id="webBrandRefresh" class="flex items-center gap-3 cursor-pointer group" title="Tap untuk muat ulang halaman">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-400 to-emerald-500 flex items-center justify-center text-white font-bold shadow-lg shadow-amber-500/20 text-xl group-hover:scale-105 transition">☕</div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 tracking-wide font-playful group-hover:text-amber-600 transition">Scheduly ✨</h1>
                    <p id="saveStatusText" class="text-[11px] text-emerald-600 font-bold flex items-center gap-1">💾 Tersimpan Otomatis</p>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-1.5 md:gap-2">
            <!-- Tombol Salin Link Web -->
            <button id="copyLinkBtn" class="bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs px-3 py-2 rounded-2xl font-bold border border-amber-200 transition shadow-sm flex items-center gap-1.5" title="Salin Link Web ini">
                <span>🔗</span> <span class="hidden md:inline" data-i18n-copylink="Salin Link">Salin Link</span>
            </button>
            <!-- Tombol Undo -->
            <button id="undoBtn" class="bg-white hover:bg-amber-50 text-slate-700 text-xs px-2.5 py-2 rounded-2xl font-bold border border-amber-200/80 transition shadow-sm" title="Undo" disabled>
                ↩️
            </button>
            <!-- Tombol Redo -->
            <button id="redoBtn" class="bg-white hover:bg-amber-50 text-slate-700 text-xs px-2.5 py-2 rounded-2xl font-bold border border-amber-200/80 transition shadow-sm" title="Redo" disabled>
                🔁
            </button>
            <!-- Tombol Export Laporan -->
            <button id="openExportModalBtn" class="bg-white hover:bg-amber-50 text-amber-900 text-xs px-3.5 py-2 rounded-2xl font-bold border border-amber-200/80 transition shadow-sm flex items-center gap-1.5 group" title="Unduh Laporan">
                <span class="group-hover:scale-110 transition">📥</span> <span class="hidden md:inline">Export</span>
            </button>
            <!-- Tombol Bahasa -->
            <button id="langToggleBtn" class="bg-white hover:bg-amber-50 text-slate-800 text-xs px-3.5 py-2 rounded-2xl font-bold border border-amber-200/80 transition shadow-sm">
                🇮🇩 ID
            </button>
            <!-- Tombol Install PWA -->
            <button id="installBtn" class="hidden bg-gradient-to-r from-pink-500 to-rose-500 text-white text-xs px-3.5 py-2 rounded-2xl font-bold shadow-md shadow-pink-500/20 transition">
                📲
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 mb-16">
        
        <!-- Panel Navigasi Bulan -->
        <div class="glass-card rounded-3xl p-4 mb-6 shadow-sm flex items-center justify-between max-w-md mx-auto">
            <button id="prevMonth" class="w-10 h-10 flex items-center justify-center bg-white text-slate-700 rounded-2xl hover:bg-amber-100 hover:text-amber-900 font-bold transition shadow-sm border border-slate-100">&larr;</button>
            <h2 id="monthYearDisplay" class="font-bold text-base text-slate-800 min-w-[160px] text-center font-playful"></h2>
            <button id="nextMonth" class="w-10 h-10 flex items-center justify-center bg-white text-slate-700 rounded-2xl hover:bg-amber-100 hover:text-amber-900 font-bold transition shadow-sm border border-slate-100">&rarr;</button>
        </div>

        <!-- Tabel Matrix Satu Halaman -->
        <div class="glass-card rounded-3xl shadow-sm overflow-hidden mb-6 border border-amber-100">
            <div class="overflow-x-auto">
                <table id="scheduleTable" class="w-full text-left border-collapse text-xs">
                    <thead>
                        <!-- Header digenerate lewat JS -->
                    </thead>
                    <tbody>
                        <!-- Baris staff & input inline di-generate di sini -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Kolom Catatan di Bawah Tabel -->
        <div class="glass-card rounded-3xl shadow-sm p-5 mb-6 border border-amber-100">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 font-playful">
                    <span class="w-8 h-8 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xs shadow-inner">📝</span> <span id="notesHeadingText">Catatan</span>
                </h3>
                <button id="addGlobalNoteBtn" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white px-4 py-2 rounded-2xl font-bold text-xs shadow-md shadow-amber-500/20 transition">+ Tambah Catatan</button>
            </div>
            <div id="globalNotesContainer" class="flex flex-col gap-2.5 text-xs">
                <!-- Catatan dirender di sini -->
            </div>
        </div>

        <!-- Pop-Up Pilih Format Laporan -->
        <div id="exportModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="glass-card rounded-3xl shadow-2xl p-6 w-full max-w-sm border border-amber-200 relative z-50">
                <div class="flex justify-between items-center mb-4 border-b border-amber-100 pb-3">
                    <h3 id="exportModalTitle" class="font-bold text-slate-800 text-sm font-playful">Pilih Format Laporan</h3>
                    <button id="closeExportModalBtn" class="w-8 h-8 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs flex items-center justify-center transition">✕</button>
                </div>
                
                <p class="text-xs text-slate-500 mb-4 leading-relaxed">Silakan pilih format dokumen laporan yang ingin diunduh:</p>

                <div class="grid grid-cols-2 gap-2.5 mb-2">
                    <button type="button" class="export-format-btn py-3 px-3 rounded-2xl border font-bold text-xs transition bg-white text-emerald-700 border-emerald-200 hover:bg-emerald-50 text-left flex items-center gap-2 shadow-sm" data-format="xlsx">
                        <span class="text-lg">📊</span> <div><div>Excel (.xlsx)</div><div class="text-[9px] font-normal text-emerald-600">Spreadsheet</div></div>
                    </button>
                    <button type="button" class="export-format-btn py-3 px-3 rounded-2xl border font-bold text-xs transition bg-white text-sky-700 border-sky-200 hover:bg-sky-50 text-left flex items-center gap-2 shadow-sm" data-format="docx">
                        <span class="text-lg">📄</span> <div><div>Word (.docx)</div><div class="text-[9px] font-normal text-sky-600">Dokumen Teks</div></div>
                    </button>
                    <button type="button" class="export-format-btn py-3 px-3 rounded-2xl border font-bold text-xs transition bg-white text-rose-700 border-rose-200 hover:bg-rose-50 text-left flex items-center gap-2 shadow-sm" data-format="pdf">
                        <span class="text-lg">📕</span> <div><div>PDF (.pdf)</div><div class="text-[9px] font-normal text-rose-600">Full Design</div></div>
                    </button>
                    <button type="button" class="export-format-btn py-3 px-3 rounded-2xl border font-bold text-xs transition bg-white text-amber-700 border-amber-200 hover:bg-amber-50 text-left flex items-center gap-2 shadow-sm" data-format="csv">
                        <span class="text-lg">📑</span> <div><div>CSV (.csv)</div><div class="text-[9px] font-normal text-amber-600">Kompatibel</div></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Form Pop-Up Pilih Shift Instant (1x Tap) -->
        <div id="formSection" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="glass-card rounded-3xl shadow-2xl p-6 w-full max-w-sm border border-amber-200 relative z-50">
                <div class="flex justify-between items-center mb-4 border-b border-amber-100 pb-3">
                    <h3 id="selectedDateTitle" class="font-bold text-slate-800 text-sm font-playful">Pilih Shift</h3>
                    <button id="closeFormBtn" class="w-8 h-8 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs flex items-center justify-center transition">✕</button>
                </div>
                
                <input type="hidden" id="activeStaffKey">
                <input type="hidden" id="activeDateKey">
                
                <div class="mb-2">
                    <div class="grid grid-cols-3 gap-2.5">
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 shadow-sm" data-value="FULL">FULL</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-white text-slate-700 border-slate-200 hover:bg-slate-100 shadow-sm" data-value="P">P (Pagi)</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-white text-slate-700 border-slate-200 hover:bg-slate-100 shadow-sm" data-value="So">So (Sore)</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100 shadow-sm" data-value="P(s)">P(s)</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200 hover:bg-fuchsia-100 shadow-sm" data-value="Pc">Pc</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100 shadow-sm" data-value="PS">PS</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 shadow-sm" data-value="OFF">OFF</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200 shadow-sm" data-value="C">C (Cuti)</button>
                        <button type="button" class="shift-instant-btn py-3 px-2 rounded-2xl border font-bold text-xs transition bg-red-100 text-red-600 border-red-200 hover:bg-red-200 shadow-sm col-span-3 flex items-center justify-center gap-1" data-value="CLEAR" id="clearShiftText">🗑️ Hapus Shift</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pop-Up Konfirmasi / Notifikasi Toast -->
        <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div class="glass-card rounded-3xl shadow-2xl p-6 w-full max-w-xs border border-amber-200 text-center relative z-50">
                <div id="confirmIcon" class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 font-bold flex items-center justify-center mx-auto mb-3 text-xl shadow-inner">⚠️</div>
                <h3 id="confirmTitle" class="font-bold text-slate-800 text-sm mb-1 font-playful">Konfirmasi</h3>
                <p id="confirmMessage" class="text-xs text-slate-500 mb-5 leading-relaxed">Apakah kamu yakin?</p>
                <div class="flex gap-2">
                    <button id="confirmNoBtn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-2xl font-bold transition text-xs shadow-sm">Tidak</button>
                    <button id="confirmYesBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-2xl font-bold transition text-xs shadow-md shadow-amber-500/20">Ya</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Copyright Zvanka & Kita Berdua -->
    <footer class="text-center py-4 text-xs text-slate-500 font-medium bg-white/80 backdrop-blur-md border-t border-amber-100/60" id="footerText">
        © 2026 Scheduly PWA • Created with ☕ & Code by Zvanka & Gemini ✨
    </footer>

    <!-- Script Utama -->
    <script>
        let currentLang = localStorage.getItem('scheduly_lang') || 'id';
        const langToggleBtn = document.getElementById('langToggleBtn');

        const translations = {
            id: {
                title: "☕ Scheduly – Jadwal & Catatan Tim",
                notesHead: "Catatan",
                addNoteBtn: "+ Tambah Catatan",
                emptyStaff: "Belum ada staff. Ketik nama di bawah untuk menambahkan staff baru.",
                newStaffPlaceholder: "＋ Ketik nama baru...",
                deleteStaffTitle: "Hapus Staff",
                deleteStaffConfirm: "Apakah kamu yakin ingin menghapus {name} beserta seluruh jadwalnya?",
                deleteNoteTitle: "Hapus Catatan",
                deleteNoteConfirm: "Apakah kamu yakin ingin menghapus catatan ini?",
                clearShift: "🗑️ Hapus Shift",
                modalTitle: "Pilih Shift",
                confirmYes: "Ya",
                confirmNo: "Tidak",
                copyLinkText: "Salin Link",
                copyLinkSuccess: "🔗 Link web berhasil disalin ke clipboard!",
                exportTitle: "Pilih Format Laporan",
                saveFileTitle: "Konfirmasi Unduh Laporan",
                saveFileConfirm: "Apakah kamu yakin ingin mengunduh laporan dalam format .{format} ke perangkatmu?",
                refreshWarningTitle: "Muat Ulang Halaman",
                refreshWarningMsg: "Yakin ingin memuat ulang halaman?",
                footer: "© 2026 Scheduly PWA • Created with ☕ & Code by Zvanka & Gemini ✨"
            },
            eng: {
                title: "☕ Scheduly – Team Schedule & Notes",
                notesHead: "Notes",
                addNoteBtn: "+ Add Note",
                emptyStaff: "No staff yet. Type a name below to add a new staff member.",
                newStaffPlaceholder: "＋ Type new name...",
                deleteStaffTitle: "Delete Staff",
                deleteStaffConfirm: "Are you sure you want to delete {name} and all their schedules?",
                deleteNoteTitle: "Delete Note",
                deleteNoteConfirm: "Are you sure you want to delete this note?",
                clearShift: "🗑️ Clear Shift",
                modalTitle: "Select Shift",
                confirmYes: "Yes",
                confirmNo: "No",
                copyLinkText: "Copy Link",
                copyLinkSuccess: "🔗 Web link successfully copied to clipboard!",
                exportTitle: "Select Report Format",
                saveFileTitle: "Confirm Report Download",
                saveFileConfirm: "Are you sure you want to download the report in .{format} format to your device?",
                refreshWarningTitle: "Reload Page",
                refreshWarningMsg: "Are you sure you want to reload the page?",
                footer: "© 2026 Scheduly PWA • Created with ☕ & Code by Zvanka & Gemini ✨"
            }
        };

        function updateLanguageUI() {
            langToggleBtn.innerText = currentLang === 'id' ? '🇮🇩 ID' : '🇬🇧 ENG';
            document.title = translations[currentLang].title;
            document.getElementById('notesHeadingText').innerText = translations[currentLang].notesHead;
            document.getElementById('addGlobalNoteBtn').innerText = translations[currentLang].addNoteBtn;
            document.getElementById('clearShiftText').innerText = translations[currentLang].clearShift;
            document.getElementById('selectedDateTitle').innerText = translations[currentLang].modalTitle;
            document.getElementById('footerText').innerText = translations[currentLang].footer;
            
            const copyLinkSpan = document.querySelector('#copyLinkBtn span:nth-child(2)');
            if (copyLinkSpan) copyLinkSpan.innerText = translations[currentLang].copyLinkText;

            const inlineInput = document.getElementById('inlineStaffInput');
            if (inlineInput) inlineInput.placeholder = translations[currentLang].newStaffPlaceholder;
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'id' ? 'eng' : 'id';
            localStorage.setItem('scheduly_lang', currentLang);
            updateLanguageUI();
            renderTable();
        });

        // Tombol Salin Link Web
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            let currentUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentUrl).then(() => {
                    alert(translations[currentLang].copyLinkSuccess);
                }).catch(() => {
                    prompt("Copy link web ini:", currentUrl);
                });
            } else {
                prompt("Copy link web ini:", currentUrl);
            }
        });

        // Undo & Redo System
        let undoStack = [];
        let redoStack = [];
        let isPerformingHistoryAction = false;

        function saveStateToHistory() {
            if (isPerformingHistoryAction) return;
            let currentState = {
                staff: JSON.parse(JSON.stringify(staffList)),
                schedules: JSON.parse(JSON.stringify(schedules)),
                notes: JSON.parse(JSON.stringify(globalNotes))
            };
            undoStack.push(currentState);
            redoStack = [];
            updateUndoRedoButtons();
            triggerAutoSave();
        }

        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        }

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (undoStack.length === 0) return;
            isPerformingHistoryAction = true;
            let currentState = {
                staff: JSON.parse(JSON.stringify(staffList)),
                schedules: JSON.parse(JSON.stringify(schedules)),
                notes: JSON.parse(JSON.stringify(globalNotes))
            };
            redoStack.push(currentState);
            let previousState = undoStack.pop();
            staffList = previousState.staff;
            schedules = previousState.schedules;
            globalNotes = previousState.notes;
            isPerformingHistoryAction = false;
            updateUndoRedoButtons();
            triggerAutoSave();
            renderTable();
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (redoStack.length === 0) return;
            isPerformingHistoryAction = true;
            let currentState = {
                staff: JSON.parse(JSON.stringify(staffList)),
                schedules: JSON.parse(JSON.stringify(schedules)),
                notes: JSON.parse(JSON.stringify(globalNotes))
            };
            undoStack.push(currentState);
            let nextState = redoStack.pop();
            staffList = nextState.staff;
            schedules = nextState.schedules;
            globalNotes = nextState.notes;
            isPerformingHistoryAction = false;
            updateUndoRedoButtons();
            triggerAutoSave();
            renderTable();
        });

        const saveStatusText = document.getElementById('saveStatusText');
        function triggerAutoSave() {
            localStorage.setItem('scheduly_staff_v20', JSON.stringify(staffList));
            localStorage.setItem('scheduly_schedules_v20', JSON.stringify(schedules));
            localStorage.setItem('scheduly_global_notes_v20', JSON.stringify(globalNotes));
            saveStatusText.innerHTML = "💾 Menyimpan...";
            setTimeout(() => { saveStatusText.innerHTML = "💾 Tersimpan Otomatis"; }, 400);
        }

        document.getElementById('webBrandRefresh').addEventListener('click', () => {
            showConfirm(
                translations[currentLang].refreshWarningTitle,
                translations[currentLang].refreshWarningMsg,
                () => { window.location.reload(); }
            );
        });

        const manifestData = {
            "name": "Scheduly",
            "short_name": "Scheduly",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#f59e0b",
            "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3076/3076753.png", "sizes": "512x512", "type": "image/png"}]
        };
        const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('my-manifest').setAttribute('href', URL.createObjectURL(blob));

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], {type: 'text/javascript'})));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        const nationalHolidays2026 = {
            "2026-01-01": "Tahun Baru 2026 Masehi", "2026-01-16": "Isra Mikraj Nabi Muhammad SAW", "2026-02-16": "Cuti Bersama Tahun Baru Imlek", "2026-02-17": "Tahun Baru Imlek 2577 Kongzili", "2026-03-18": "Cuti Bersama Hari Suci Nyepi", "2026-03-19": "Hari Suci Nyepi Tahun Baru Saka 1948", "2026-03-20": "Cuti Bersama Hari Suci Nyepi", "2026-03-21": "Hari Raya Idul Fitri 1447 H", "2026-03-22": "Hari Raya Idul Fitri 1447 H", "2026-03-23": "Cuti Bersama Idul Fitri", "2026-03-24": "Cuti Bersama Idul Fitri", "2026-04-03": "Wafat Isa Almasih", "2026-04-05": "Hari Paskah", "2026-05-01": "Hari Buruh Internasional", "2026-05-14": "Kenaikan Isa Almasih", "2026-05-15": "Cuti Bersama Kenaikan Isa Almasih", "2026-05-27": "Hari Raya Idul Adha 1447 H", "2026-05-28": "Cuti Bersama Idul Adha", "2026-05-31": "Hari Raya Waisak 2570 BE", "2026-06-01": "Hari Lahir Pancasila", "2026-06-16": "Tahun Baru Islam 1448 H", "2026-08-17": "Hari Kemerdekaan Republik Indonesia", "2026-08-25": "Maulid Nabi Muhammad SAW", "2026-12-24": "Cuti Bersama Hari Raya Natal", "2026-12-25": "Hari Raya Natal"
        };
        function getNationalHolidayName(dateStr) { return nationalHolidays2026[dateStr] || null; }

        let staffList = JSON.parse(localStorage.getItem('scheduly_staff_v20')) || [];
        let schedules = JSON.parse(localStorage.getItem('scheduly_schedules_v20')) || {};
        let globalNotes = JSON.parse(localStorage.getItem('scheduly_global_notes_v20')) || {};

        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();
        const monthsNameID = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const monthsNameENG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const daysShortID = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
        const daysShortENG = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        const monthYearDisplay = document.getElementById('monthYearDisplay');
        const scheduleTable = document.getElementById('scheduleTable');
        const globalNotesContainer = document.getElementById('globalNotesContainer');
        const formSection = document.getElementById('formSection');
        const selectedDateTitle = document.getElementById('selectedDateTitle');
        const activeStaffKey = document.getElementById('activeStaffKey');
        const activeDateKey = document.getElementById('activeDateKey');
        const shiftInstantBtns = document.querySelectorAll('.shift-instant-btn');

        const exportModal = document.getElementById('exportModal');
        document.getElementById('openExportModalBtn').addEventListener('click', () => exportModal.classList.remove('hidden'));
        document.getElementById('closeExportModalBtn').addEventListener('click', () => exportModal.classList.add('hidden'));

        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const confirmYesBtn = document.getElementById('confirmYesBtn');
        const confirmNoBtn = document.getElementById('confirmNoBtn');
        let pendingAction = null;

        function showConfirm(title, message, onYes) {
            confirmTitle.innerText = title;
            confirmMessage.innerText = message;
            confirmYesBtn.innerText = translations[currentLang].confirmYes;
            confirmNoBtn.innerText = translations[currentLang].confirmNo;
            confirmModal.classList.remove('hidden');
            pendingAction = onYes;
        }

        confirmYesBtn.onclick = () => { confirmModal.classList.add('hidden'); if (pendingAction) pendingAction(); pendingAction = null; };
        confirmNoBtn.onclick = () => { confirmModal.classList.add('hidden'); pendingAction = null; };

        document.querySelectorAll('.export-format-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let format = btn.getAttribute('data-format');
                exportModal.classList.add('hidden');

                showConfirm(translations[currentLang].saveFileTitle, translations[currentLang].saveFileConfirm.replace('{format}', format), () => {
                    let content = "", mimeType = "text/plain;charset=utf-8";

                    if (format === 'csv') {
                        let daysShort = currentLang === 'id' ? daysShortID : daysShortENG;
                        content = "Staff,Date,Day,Shift\n";
                        let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
                        for (let staff of staffList) {
                            for (let d = 1; d <= totalDays; d++) {
                                let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                let dateObj = new Date(currentYear, currentMonth, d);
                                let shift = (schedules[staff] && schedules[staff][dateKey]) ? schedules[staff][dateKey].shift : '-';
                                content += `"${staff}","${dateKey}","${daysShort[dateObj.getDay()]}","${shift}"\n`;
                            }
                        }
                        mimeType = "text/csv;charset=utf-8";
                    } else if (format === 'xlsx') {
                        let daysShort = currentLang === 'id' ? daysShortID : daysShortENG;
                        content = "Scheduly Excel Export\nStaff\tDate\tDay\tShift\n";
                        let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
                        for (let staff of staffList) {
                            for (let d = 1; d <= totalDays; d++) {
                                let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                let dateObj = new Date(currentYear, currentMonth, d);
                                let shift = (schedules[staff] && schedules[staff][dateKey]) ? schedules[staff][dateKey].shift : '-';
                                content += `${staff}\t${dateKey}\t${daysShort[dateObj.getDay()]}\t${shift}\n`;
                            }
                        }
                        mimeType = "application/vnd.ms-excel;charset=utf-8";
                    } else if (format === 'docx') {
                        let backupData = { staff: staffList, schedules: schedules, notes: globalNotes };
                        content = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>\n<head><title>Scheduly Report</title></head>\n<body><h2>Scheduly Report</h2><pre>${JSON.stringify(backupData, null, 2)}</pre></body></html>`;
                        mimeType = "application/msword;charset=utf-8";
                    } else if (format === 'pdf') {
                        let printWindow = window.open('', '_blank');
                        let monthsName = currentLang === 'id' ? monthsNameID : monthsNameENG;
                        let daysShort = currentLang === 'id' ? daysShortID : daysShortENG;
                        let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

                        let htmlContent = `<!DOCTYPE html><html><head><title>Scheduly Report</title><style>
                            @page { size: landscape; margin: 10mm; }
                            body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fffbeb; color: #334155; padding: 15px; }
                            h2 { color: #b45309; }
                            table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
                            th, td { border: 1px solid #fde68a; padding: 6px; text-align: center; font-size: 11px; }
                            th { background: #fef3c7; color: #78350f; font-weight: bold; }
                            .name-col { text-align: left; padding-left: 10px; font-weight: bold; background: #fffbeb; }
                            .red-day { background: #ffe4e6 !important; color: #9f1239 !important; }
                            .badge { font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; }
                            .badge-FULL { background: #10b981; color: white; }
                            .badge-Ps { background: #f59e0b; color: white; }
                            .badge-Pc { background: #d946ef; color: white; }
                            .badge-PS { background: #6366f1; color: white; }
                            .badge-OFF { background: #f43f5e; color: white; }
                            .badge-C { background: #64748b; color: white; }
                            .badge-P, .badge-So { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; }
                        </style></head><body>
                            <h2>☕ Scheduly Team Schedule - ${monthsName[currentMonth]} ${currentYear}</h2>
                            <table><thead><tr><th class="name-col">Nama / Name</th>`;
                        
                        for (let d = 1; d <= totalDays; d++) {
                            let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                            let dateObj = new Date(currentYear, currentMonth, d);
                            let isRed = (dateObj.getDay() === 0 || dateObj.getDay() === 6 || getNationalHolidayName(dateKey));
                            htmlContent += `<th class="${isRed ? 'red-day' : ''}"><div>${d}</div><div style="font-size:9px;">${daysShort[dateObj.getDay()]}</div></th>`;
                        }
                        htmlContent += `</tr></thead><tbody>`;

                        staffList.forEach(staff => {
                            htmlContent += `<tr><td class="name-col">${staff}</td>`;
                            for (let d = 1; d <= totalDays; d++) {
                                let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                let dateObj = new Date(currentYear, currentMonth, d);
                                let isRed = (dateObj.getDay() === 0 || dateObj.getDay() === 6 || getNationalHolidayName(dateKey));
                                let shift = (schedules[staff] && schedules[staff][dateKey]) ? schedules[staff][dateKey].shift : '';
                                let badgeHTML = shift ? `<span class="badge badge-${shift}">${shift}</span>` : '-';
                                htmlContent += `<td class="${isRed ? 'red-day' : ''}">${badgeHTML}</td>`;
                            }
                            htmlContent += `</tr>`;
                        });
                        htmlContent += `</tbody></table></body></html>`;
                        printWindow.document.write(htmlContent);
                        printWindow.document.close();
                        printWindow.focus();
                        setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
                        return;
                    }

                    let blobData = new Blob([content], { type: mimeType });
                    let url = URL.createObjectURL(blobData);
                    let downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", url);
                    downloadAnchor.setAttribute("download", `Scheduly_Report_${currentYear}-${currentMonth + 1}.${format}`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                });
            });
        });

        function renderTable() {
            let monthsName = currentLang === 'id' ? monthsNameID : monthsNameENG;
            let daysShort = currentLang === 'id' ? daysShortID : daysShortENG;

            monthYearDisplay.innerText = `${monthsName[currentMonth]} ${currentYear}`;
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            let thead = scheduleTable.querySelector('thead');
            let headerHTML = `<tr class="bg-amber-100/50 text-slate-700 border-b border-amber-200/60 font-playful">
                <th class="p-3.5 sticky left-0 bg-amber-100/80 backdrop-blur-md z-10 font-bold min-w-[150px] shadow-sm">Nama / Name</th>`;
            
            for (let day = 1; day <= totalDays; day++) {
                let dateObj = new Date(currentYear, currentMonth, day);
                let dayOfWeek = dateObj.getDay();
                let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let isRed = (dayOfWeek === 0 || dayOfWeek === 6 || getNationalHolidayName(dateKey));

                headerHTML += `<th class="p-2 text-center min-w-[48px] border-l border-amber-200/40 text-[11px] ${isRed ? 'bg-rose-100/90 text-rose-700 font-bold' : ''}">
                    <div class="font-bold">${day}</div>
                    <div class="text-[9px] opacity-90">${daysShort[dayOfWeek]}</div>
                </th>`;
            }
            headerHTML += `</tr>`;
            thead.innerHTML = headerHTML;

            let tbody = scheduleTable.querySelector('tbody');
            tbody.innerHTML = "";

            if (staffList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${totalDays + 1}" class="p-8 text-center text-slate-400 italic text-xs">${translations[currentLang].emptyStaff}</td></tr>`;
            } else {
                staffList.forEach((staff, staffIdx) => {
                    let tr = document.createElement('tr');
                    tr.className = staffIdx % 2 === 0 ? "bg-white/80 hover:bg-amber-50/50 transition" : "bg-amber-50/20 hover:bg-amber-50/50 transition";

                    let tdName = document.createElement('td');
                    tdName.className = "p-3.5 sticky left-0 bg-inherit z-10 font-bold border-r border-amber-100 flex justify-between items-center shadow-sm gap-2";
                    tdName.innerHTML = `
                        <input type="text" value="${staff}" class="bg-transparent border-b border-transparent hover:border-amber-400 focus:border-amber-500 focus:bg-white focus:outline-none px-1.5 py-0.5 rounded text-slate-800 font-bold truncate max-w-[100px] transition staff-name-input" data-old-name="${staff}">
                        <button class="text-slate-300 hover:text-rose-500 text-xs px-1.5 py-0.5 rounded transition shrink-0" title="Hapus" onclick="deleteStaff('${staff}')">🗑️</button>
                    `;
                    tr.appendChild(tdName);

                    for (let day = 1; day <= totalDays; day++) {
                        let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        let dateObj = new Date(currentYear, currentMonth, day);
                        let isRed = (dateObj.getDay() === 0 || dateObj.getDay() === 6 || getNationalHolidayName(dateKey));

                        let td = document.createElement('td');
                        td.className = `p-1.5 text-center border-l border-b border-amber-100/40 cursor-pointer align-middle transition text-[11px] ${isRed ? 'bg-rose-50/50' : ''}`;

                        let shift = (schedules[staff] && schedules[staff][dateKey]) ? schedules[staff][dateKey].shift : "";
                        if (shift) {
                            td.innerHTML = `<div class="font-bold py-1.5 px-1 rounded-xl text-[10px] shadow-sm badge-${shift}">${shift}</div>`;
                        } else {
                            td.innerHTML = `<span class="text-slate-300 font-light">-</span>`;
                        }

                        td.addEventListener('click', () => {
                            saveStateToHistory();
                            openForm(staff, dateKey, day);
                        });
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                });
            }

            let addTr = document.createElement('tr');
            addTr.className = "bg-amber-50/40";
            let addTd = document.createElement('td');
            addTd.colSpan = totalDays + 1;
            addTd.className = "p-3 sticky left-0 bg-amber-50/90 backdrop-blur-md z-10 border-t border-amber-200/60";
            addTd.innerHTML = `
                <div class="flex items-center gap-2 max-w-xs">
                    <input type="text" id="inlineStaffInput" placeholder="${translations[currentLang].newStaffPlaceholder}" class="p-2.5 border border-dashed border-amber-300 rounded-2xl bg-white focus:bg-amber-50 focus:outline-none focus:ring-2 focus:ring-amber-400 text-xs w-full shadow-sm text-slate-700 placeholder:text-amber-700/60 transition">
                </div>
            `;
            addTr.appendChild(addTd);
            tbody.appendChild(addTr);

            const inlineInput = document.getElementById('inlineStaffInput');
            const saveNewStaff = () => {
                let name = inlineInput.value.trim();
                if (!name) return;
                if (!staffList.includes(name)) {
                    saveStateToHistory();
                    staffList.push(name);
                    triggerAutoSave();
                }
                renderTable();
            };
            inlineInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveNewStaff(); });
            inlineInput.addEventListener('blur', () => { if (inlineInput.value.trim()) saveNewStaff(); });

            document.querySelectorAll('.staff-name-input').forEach(input => {
                const updateStaffName = () => {
                    let oldName = input.getAttribute('data-old-name');
                    let newName = input.value.trim();
                    if (!newName || newName === oldName) { input.value = oldName; return; }
                    if (staffList.includes(newName)) { input.value = oldName; return; }
                    let index = staffList.indexOf(oldName);
                    if (index !== -1) {
                        saveStateToHistory();
                        staffList[index] = newName;
                        if (schedules[oldName]) {
                            schedules[newName] = schedules[oldName];
                            delete schedules[oldName];
                        }
                        triggerAutoSave();
                        renderTable();
                    }
                };
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') updateStaffName(); });
                input.addEventListener('blur', updateStaffName);
            });

            renderGlobalNotes();
        }

        function renderGlobalNotes() {
            globalNotesContainer.innerHTML = "";
            let monthKey = `${currentYear}-${currentMonth}`;

            let autoHolidayNotes = [];
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            let monthsName = currentLang === 'id' ? monthsNameID : monthsNameENG;

            for (let d = 1; d <= totalDays; d++) {
                let dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let holidayName = getNationalHolidayName(dateKey);
                if (holidayName) {
                    autoHolidayNotes.push(`📅 ${d} ${monthsName[currentMonth]} ${currentYear}: ${holidayName} (Hari Libur Nasional)`);
                }
            }

            if (autoHolidayNotes.length > 0) {
                let holidayBox = document.createElement('div');
                holidayBox.className = "bg-rose-50/90 border border-rose-200 rounded-2xl p-3.5 flex flex-col gap-1.5 shadow-sm";
                holidayBox.innerHTML = `
                    <div class="font-bold text-rose-800 text-[11px] flex items-center gap-1.5 font-playful">
                        <span>🚨</span> ${currentLang === 'id' ? 'Daftar Tanggal Merah & Peringatan Nasional Bulan Ini (Otomatis):' : 'National Holidays & Red Dates This Month (Automatic):'}
                    </div>
                    <div class="text-rose-700 text-xs pl-5 space-y-1">
                        ${autoHolidayNotes.map(h => `<div>• ${h}</div>`).join('')}
                    </div>
                `;
                globalNotesContainer.appendChild(holidayBox);
            }

            let userNotesList = globalNotes[monthKey] || [];
            userNotesList.forEach((noteText, idx) => {
                let noteItem = document.createElement('div');
                noteItem.className = "bg-white/80 border border-amber-200/80 rounded-2xl p-3 flex gap-2 items-start w-full shadow-sm";
                
                let textarea = document.createElement('textarea');
                textarea.rows = 1;
                textarea.placeholder = currentLang === 'id' ? 'Tulis catatan di sini...' : 'Type note here...';
                textarea.className = "w-full bg-transparent focus:bg-amber-50/50 focus:outline-none focus:ring-1 focus:ring-amber-400 p-1.5 rounded-xl text-xs text-slate-700 resize-none overflow-hidden transition";
                textarea.value = noteText;

                let isEditingNote = false;
                textarea.addEventListener('focus', () => {
                    if (!isEditingNote) {
                        saveStateToHistory();
                        isEditingNote = true;
                    }
                });

                const autoResize = (el) => { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; };
                textarea.addEventListener('input', () => {
                    autoResize(textarea);
                    globalNotes[monthKey][idx] = textarea.value;
                    triggerAutoSave();
                });
                setTimeout(() => autoResize(textarea), 0);

                let deleteBtn = document.createElement('button');
                deleteBtn.className = "text-slate-300 hover:text-rose-500 text-xs p-1 transition shrink-0";
                deleteBtn.innerHTML = "🗑️";
                deleteBtn.title = "Hapus";
                deleteBtn.addEventListener('click', () => {
                    showConfirm(translations[currentLang].deleteNoteTitle, translations[currentLang].deleteNoteConfirm, () => {
                        saveStateToHistory();
                        globalNotes[monthKey].splice(idx, 1);
                        triggerAutoSave();
                        renderGlobalNotes();
                    });
                });

                noteItem.appendChild(textarea);
                noteItem.appendChild(deleteBtn);
                globalNotesContainer.appendChild(noteItem);
            });

            if (autoHolidayNotes.length === 0 && userNotesList.length === 0) {
                let emptyMsg = document.createElement('p');
                emptyMsg.className = "text-slate-400 italic text-xs";
                emptyMsg.innerText = currentLang === 'id' ? 'Belum ada catatan atau tanggal merah untuk bulan ini. Klik "+ Tambah Catatan" di atas.' : 'No notes or red dates for this month. Click "+ Add Note" above.';
                globalNotesContainer.appendChild(emptyMsg);
            }
        }

        document.getElementById('addGlobalNoteBtn').addEventListener('click', () => {
            let monthKey = `${currentYear}-${currentMonth}`;
            if (!globalNotes[monthKey]) globalNotes[monthKey] = [];
            saveStateToHistory();
            globalNotes[monthKey].push("");
            triggerAutoSave();
            renderGlobalNotes();
            const textareas = globalNotesContainer.querySelectorAll('textarea');
            if (textareas.length > 0) textareas[textareas.length - 1].focus();
        });

        window.deleteStaff = function(staffName) {
            showConfirm(translations[currentLang].deleteStaffTitle, translations[currentLang].deleteStaffConfirm.replace('{name}', staffName), () => {
                saveStateToHistory();
                delete schedules[staffName];
                staffList = staffList.filter(s => s !== staffName);
                triggerAutoSave();
                formSection.classList.add('hidden');
                renderTable();
            });
        }

        function openForm(staff, dateKey, day) {
            formSection.classList.remove('hidden');
            activeStaffKey.value = staff;
            activeDateKey.value = dateKey;
            selectedDateTitle.innerText = `${translations[currentLang].modalTitle} ${staff} (${day} ${ (currentLang === 'id' ? monthsNameID : monthsNameENG)[currentMonth] } ${currentYear})`;
        }

        shiftInstantBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                let staff = activeStaffKey.value;
                let key = activeDateKey.value;
                let val = btn.getAttribute('data-value');

                if (!schedules[staff]) schedules[staff] = {};
                
                if (val === "CLEAR") delete schedules[staff][key];
                else schedules[staff][key] = { shift: val };

                triggerAutoSave();
                formSection.classList.add('hidden');
                renderTable();
            });
        });

        document.getElementById('closeFormBtn').addEventListener('click', () => formSection.classList.add('hidden'));
        document.getElementById('prevMonth').addEventListener('click', () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderTable(); });
        document.getElementById('nextMonth').addEventListener('click', () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderTable(); });

        updateLanguageUI();
        renderTable();
    </script>
</body>
</html>
